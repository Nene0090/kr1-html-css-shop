<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Заказ</title>
    <link rel="stylesheet" href="">
</head>

<body>
    <form action="#" method="post">
        <label for="user-name">Имя</label>
        <input id="user-name" name="name" type="text" required>

        <label for="user-email">Почта</label>
        <input id="user-email" name="email" type="email" required>

        <label for="user-tel">Телефон</label>
        <input id="user-tel" name="tel" type="tel" required>

        <label for="user-question">Вопрос/Предложение</label>
        <input id="user-question" name="question" type="text" required>

        <button type="submit">Отправить</button>
    </form>
</body>
</html>
